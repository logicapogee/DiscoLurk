# cp .env.example .env, set LURK_TOKEN (or use the secret below), then: docker compose up -d
services:
  disco-lurk:
    image: ghcr.io/logicapogee/discolurk:${LURK_IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: disco-lurk
    restart: unless-stopped
    # Every LURK_* setting and TZ come from .env; unset ones take the application's defaults.
    env_file: .env
    ports:
      - "${LURK_PORT:-8080}:${LURK_PORT:-8080}"
    volumes:
      # Profiles, schedules, run history and logs: /data/disco-lurk/...
      - ./data:/data
    # To keep the token out of the environment, put it in ./lurk_token, uncomment these lines and
    # leave LURK_TOKEN empty in .env; LURK_TOKEN_FILE wins over LURK_TOKEN.
    # secrets:
    #   - lurk_token
    # environment:
    #   LURK_TOKEN_FILE: /run/secrets/lurk_token
    # Chrome keeps renderer memory in /dev/shm; Docker's 64 MB default makes pages crash.
    shm_size: 1gb
    # A run stops gracefully and reads the progress page once more before exiting.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

