<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source of the app icon. Regenerate with: rsvg-convert -w 1024 icon.svg -o icon.png && npx tauri icon icon-src/icon.png -o src-tauri/icons (from apps/desktop), then drop the android/ and ios/ output. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22305a"/>
      <stop offset="1" stop-color="#11162b"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fe6ff"/>
      <stop offset="1" stop-color="#0090d9"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.4" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#7dffbe"/>
      <stop offset="1" stop-color="#00c46a"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <!-- Discourse-style speech bubble with a tail at the lower left -->
  <path filter="url(#shadow)" fill="url(#bubble)"
        d="M512 236 C 676 236 792 352 792 500 C 792 648 676 764 512 764 C 470 764 430 756 394 741 L 258 786 L 298 666 C 255 620 232 562 232 500 C 232 352 348 236 512 236 Z"/>

  <!-- the lurking eye -->
  <path fill="#0f1428" d="M330 500 C 390 404 450 368 512 368 C 574 368 634 404 694 500 C 634 596 574 632 512 632 C 450 632 390 596 330 500 Z"/>
  <circle cx="512" cy="500" r="100" fill="url(#iris)"/>
  <circle cx="512" cy="500" r="44" fill="#0f1428"/>
  <circle cx="548" cy="462" r="20" fill="#ffffff" opacity="0.9"/>
</svg>
