[package]
name = "disco-lurk"
version = "0.1.0"
description = "DiscoLurk desktop shell"
edition = "2021"
publish = false

[lib]
name = "disco_lurk_lib"
# Desktop only: the mobile targets that need staticlib/cdylib are not built.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

# macOS builds are unsigned and never self-update.
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_os = "macos")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
