name: Build

# Desktop installers, the single-file CLI and, for v* tags, a release carrying them. Nothing is
# code-signed or notarized. Windows/Linux updater bundles are signed with Tauri's minisign key
# only when the updater public key is configured and the TAURI_SIGNING_PRIVATE_KEY secret exists.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Tag matches the app version
        if: github.ref_type == 'tag'
        run: node .github/scripts/check-version.ts "$GITHUB_REF_NAME"
      - run: pnpm vitest run
      - run: pnpm typecheck

  build:
    name: ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: nsis
            updater: true
          - name: macos-arm64
            os: macos-latest
            triple: aarch64-apple-darwin
            bundles: app,dmg
            updater: false
          # GitHub's last Intel macOS image; macos-13 has been retired.
          - name: macos-x64
            os: macos-15-intel
            triple: x86_64-apple-darwin
            bundles: app,dmg
            updater: false
          # The oldest supported base: bundles built here run on newer glibc, not the reverse.
          - name: linux-x64
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            updater: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb

      - uses: ./.github/actions/setup
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # The gates drive the system Chrome a user would have, at the path Playwright's
      # `channel: 'chrome'` looks in; hosted images usually ship it, and no Playwright browser
      # build is ever downloaded.
      - name: Google Chrome
        run: |
          case "$RUNNER_OS" in
            Linux) candidates="/opt/google/chrome/chrome" ;;
            macOS) candidates="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ;;
            Windows) candidates="$(cygpath -u "$PROGRAMFILES")/Google/Chrome/Application/chrome.exe
          $(cygpath -u "${PROGRAMFILES} (x86)")/Google/Chrome/Application/chrome.exe
          $(cygpath -u "$LOCALAPPDATA")/Google/Chrome/Application/chrome.exe" ;;
          esac
          while IFS= read -r chrome; do
            if [ -e "$chrome" ]; then
              echo "Using the preinstalled Chrome at $chrome"
              exit 0
            fi
          done <<< "$candidates"
          pnpm exec playwright-core install chrome

      - run: pnpm build:sidecar ${{ matrix.triple }}

      - name: Sidecar gate (headless)
        run: pnpm gate:sidecar

      - name: Sidecar gate (headed)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum pnpm gate:sidecar --headed
          else
            pnpm gate:sidecar --headed
          fi

      # Updater bundles need both halves of the minisign pair: the public key in tauri.conf.json,
      # which the installed app verifies against, and the private key secret that signs them.
      - name: Updater signing
        id: updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          pubkey=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').plugins.updater.pubkey")
          if [ "${{ matrix.updater }}" != true ]; then
            echo 'config={}' >> "$GITHUB_OUTPUT"
          elif [ -z "$pubkey" ]; then
            echo "::warning title=Updater bundles skipped::plugins.updater.pubkey in tauri.conf.json is empty, so ${{ matrix.name }} ships without updater artifacts"
            echo 'config={}' >> "$GITHUB_OUTPUT"
          elif [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning title=Updater bundles skipped::TAURI_SIGNING_PRIVATE_KEY is not set, so ${{ matrix.name }} ships without signed updater artifacts"
            echo 'config={}' >> "$GITHUB_OUTPUT"
          else
            echo 'config={"bundle":{"createUpdaterArtifacts":true}}' >> "$GITHUB_OUTPUT"
          fi

      - name: Tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # The sidecar was built and gated above; a null beforeBuildCommand keeps Tauri from building it again.
        run: pnpm tauri build --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }} --config '{"build":{"beforeBuildCommand":null}}' --config '${{ steps.updater.outputs.config }}'

      - name: Collect artifacts
        run: node scripts/ci-collect.ts --triple ${{ matrix.triple }} --name ${{ matrix.name }} --out out

      - uses: actions/upload-artifact@v4
        with:
          name: disco-lurk-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: disco-lurk-*
          merge-multiple: true
      - name: Updater manifest
        run: node .github/scripts/updater-manifest.ts artifacts "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
      - uses: softprops/action-gh-release@v2
        with:
          # A `-` suffix (v1.2.0-rc.1) marks a pre-release; the updater only follows full releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false
          generate_release_notes: true
          files: artifacts/**/*
          body: |
            ## 安装前须知

            安装包均**未做代码签名**，首次运行需要手动放行。

            **macOS**（未签名、未公证）：把 DiscoLurk 拖进「应用程序」后，在终端执行

            ```sh
            xattr -cr /Applications/DiscoLurk.app
            ```

            或在「系统设置 → 隐私与安全性」里点「仍要打开」。单文件 CLI 先执行 `xattr -c ./lurk-macos-*` 再运行。macOS 版不自动更新，有新版本时应用会提示并打开本页面。

            **Windows**：SmartScreen 提示「Windows 已保护你的电脑」时，点「更多信息 → 仍要运行」。安装器缺少 WebView2 时会自动下载。

            **Linux**：deb 与 AppImage 依赖 webkit2gtk-4.1。
